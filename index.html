<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a2e1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Crew Rest" />
    <title>Crew Rest</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./icons/icon-167.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./icons/icon-152.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">

      <header class="hero">
        <div class="hero-brand">
          <svg class="hero-icon" viewBox="0 0 28 28" fill="none" aria-hidden="true">
            <circle cx="14" cy="14" r="12.5" stroke="currentColor" stroke-width="1.4" stroke-opacity="0.5"/>
            <path d="M14 5v9.2l5.5 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="14" cy="14" r="1.8" fill="currentColor"/>
          </svg>
          <h1>Crew Rest</h1>
        </div>
        <label class="theme-field">
          <span class="theme-label">Theme</span>
          <select id="theme-mode" aria-label="Theme mode">
            <option value="day">Day</option>
            <option value="night">Night</option>
            <option value="auto">Auto</option>
          </select>
        </label>
      </header>

      <div class="layout">

        <section class="card controls">
          <div id="config-form">

            <div class="field-group">
              <span class="field-group-label">Shift window</span>
              <div class="field-row">
                <label class="field">
                  <span class="field-label">Off duty</span>
                  <input
                    id="shift-start"
                    type="hidden"
                    value="00:00"
                    required
                  />
                  <button
                    class="time-trigger"
                    type="button"
                    data-time-target="shift-start"
                    data-time-kind="clock"
                    aria-label="Choose off-duty time"
                  >00:00</button>
                </label>
                <span class="field-arrow" aria-hidden="true">→</span>
                <label class="field">
                  <span class="field-label">All on</span>
                  <input
                    id="shift-end"
                    type="hidden"
                    value="17:00"
                    required
                  />
                  <button
                    class="time-trigger"
                    type="button"
                    data-time-target="shift-end"
                    data-time-kind="clock"
                    aria-label="Choose all-on time"
                  >17:00</button>
                </label>
              </div>
            </div>

            <div class="field-group">
              <span class="field-group-label">Crew settings</span>
              <div class="field-row">
                <label class="field">
                  <span class="field-label">Crew count</span>
                  <select id="crew-count" required>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                  </select>
                </label>
                <label class="field">
                  <span class="field-label">Breaks</span>
                  <input id="rounds" type="number" value="2" min="1" max="12" required />
                </label>
              </div>
            </div>

            <div class="field-group summary-inline">
              <span class="field-group-label">Summary</span>
              <div id="summary" class="summary-grid"></div>
            </div>

          </div>

          <p id="error" class="error" role="alert"></p>
        </section>

        <div class="results-column">
          <section class="card">
            <div class="section-heading">
              <h2>Schedule</h2>
              <button type="button" id="reset-durations" class="secondary">Reset durations</button>
            </div>
            <p id="schedule-warning" class="schedule-warning" role="alert"></p>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Crew</th>
                    <th>Off</th>
                    <th>On</th>
                    <th>Duration</th>
                  </tr>
                </thead>
                <tbody id="schedule-body"></tbody>
              </table>
            </div>
          </section>
        </div>

      </div>
    </main>

    <div id="time-picker-dialog" class="time-picker-dialog" hidden>
      <div class="time-picker-backdrop" data-time-picker-cancel></div>
      <section class="time-picker-sheet" role="dialog" aria-modal="true" aria-labelledby="time-picker-title">
        <h2 id="time-picker-title">Select time</h2>
        <div class="time-picker-wheels">
          <div class="time-picker-wheel" aria-label="Hours">
            <span>Hours</span>
            <button type="button" class="wheel-step" data-wheel="hour" data-delta="-1" aria-label="Decrease hours">▲</button>
            <div id="time-picker-hours" class="wheel-values"></div>
            <button type="button" class="wheel-step" data-wheel="hour" data-delta="1" aria-label="Increase hours">▼</button>
          </div>
          <span class="time-picker-separator" aria-hidden="true">:</span>
          <div class="time-picker-wheel" aria-label="Minutes">
            <span>Minutes</span>
            <button type="button" class="wheel-step" data-wheel="minute" data-delta="-1" aria-label="Decrease minutes">▲</button>
            <div id="time-picker-minutes" class="wheel-values"></div>
            <button type="button" class="wheel-step" data-wheel="minute" data-delta="1" aria-label="Increase minutes">▼</button>
          </div>
        </div>
        <div class="time-picker-actions">
          <button type="button" class="secondary" data-time-picker-cancel>Cancel</button>
          <button type="button" id="time-picker-set">Set</button>
        </div>
      </section>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
